# Toza v2 — shared editorial copy (English).
#
# Rule (see content/CONTENT-MODEL.md §5):
#   * Page file (src/content/en/<page>.md) — copy that appears on one page only.
#   * This file — editorial copy that appears on more than one page: Toza's
#     promise line, the method statement, offer names and descriptions, price
#     labels, the three stages, the exposure-summary specimen and the contact
#     block. The person byline (`person`) is used on About only (V-045).
#   * src/_data/i18n/en.json `ui`, `nav`, `footer`, `buttons` — UI chrome: words
#     that operate the interface (navigation, footer links, action buttons,
#     accessibility-only labels, toggles, glyphs). Not duplicated here.
#
# Transition: the templates still read the editorial strings from i18n/en.json.
# `npm run check:content` fails if any editorial i18n string is missing from
# this file, so the two cannot drift before the wiring step removes them.
#
# Tokens: {price:key} {fact:path} {factword:path} {Factword:path} {shared:path} {ui:path}.
# Never type a price, a day count or a key count; facts live in src/_data/facts.json.
#
# `common:` holds sentences used on more than one page (V-036). Pages refer to
# them as {shared:common.<key>}. check:content fails on a sentence of 6+ words
# that is typed on two pages instead.

# Toza's promise: shown under the hero actions (hero `promise: true`) and as the
# tagline of the About byline. It is Toza's, not the founder's (V-045).
promise: In person · With you present · You control your credentials

# The founder byline: About only (V-045). Toza speaks by name everywhere else.
person:
  name: Dr. Lior Tabansky
  tagline: "{shared:promise}"
  tagline_short: In person · You control your credentials

method: Hardening is Toza's own method, developed from public guidance of government security agencies and security vendors.

common:
  some_of_it: Some of it you still need.
  start_checked: Start with what can be checked.
  sequence: You agree the sequence together before anything changes.
  verify_and_learn: Verify it works, and learn to run it.
  attorney_summary: With your authorization, you receive an attorney-friendly summary of the work and what remains, and timing can be coordinated with counsel.
  coordinates: If you authorize it, Toza coordinates with your lawyer or family office.
  engagement_in_person: Toza carries out every engagement in person, at your home or office, with you present and in control of your credentials.
  price_fixed: Each price is fixed and agreed in writing before work begins.
  one_first_step: One first step, then the protection that fits your household.
  first_conversation: The first conversation is free and commits you to nothing.
  after_window: "After day {fact:credit.windowDays}, the tier is charged at its full price."
  essential_migration: Essential migration covers identity, recovery routes and critical-service access where needed.
  availability: Availability is confirmed before you pay.
  urgent_arrival: For an accepted urgent booking, arrival is within four hours of both Toza's acceptance and receipt of payment.

labels:
  start_here: Start here
  first_step: First step
  from: from            # i18n price.from — not shown on any page at present
  conditions: Conditions
  all_tiers: All protection tiers
  how_it_works: How it works

offers:
  assessment:
    name: Private Exposure Assessment
    body: "A senior check-up of your digital life: half a day in person, urgent first aid on the spot, and a written exposure summary you keep whether or not you continue."
    credit: "Counts in full toward your protection if you continue within {fact:credit.windowDays} days."
    credit_short: "Counts in full toward your protection within {fact:credit.windowDays} days."
  shield:
    name: Personal Shield
    short: Personal Shield
    for: For one person. Your phone, computer, accounts and home network hardened around your risks.
    items:
      - "{Factword:securityKeys.personalShield} security keys, configured and tested"
      - A follow-up visit after about four weeks
      - "Questions answered by WhatsApp or Signal for {fact:questionLineDays} days"
    home_line: Fixed and agreed in writing before any work, first step included.
  two:
    name: Personal Shield for Two
    short: for Two
    for: For you and one other person.
    items:
      - Each person's phone, computer and accounts
      - "Your home network · {factword:securityKeys.shieldForTwo} security keys"
      - "Follow-up visit · {fact:questionLineDays} days of answered questions"
  inner:
    name: Inner Circle
    for: For a household of up to four.
    items:
      - Everyone's phones, computers and accounts, each kept private
      - "Your home network · {factword:securityKeys.innerCircle} security keys"
      - "Follow-up visit · {fact:questionLineDays} days of answered questions · review visit at twelve months"
  under_all: "The first step is included. {shared:common.coordinates}"
  larger: "Larger households, several residences or household staff: one fixed price, set out after the first step, from {price:largerFrom}."
  care: "After the {fact:questionLineDays} days: Annual Care for past clients, from {price:annualCareFrom} a year."

pricing:
  heading: Fees
  lead: "{shared:common.one_first_step} {shared:common.price_fixed}"
  method: "{shared:common.engagement_in_person} {shared:method}"

stages:
  heading: Three stages, one person.
  names:
    assess: Assess
    harden: Harden
    verify: Verify
  headings:
    assess: Your threat model, your risks in order, and urgent first aid.
  lines:
    assess: "{shared:stages.headings.assess} Typically four hours."
    harden: Settings, accounts and recovery rebuilt around your risks. Security keys supplied and configured.
    verify: Changes tested and checked, and you are taught to use them. A private dated record of the work.
  image_alts:
    assess: A laptop, a phone and a one-page summary on a table
    harden: Two hardware security keys
    verify: A closed record folder with a dated label
  record_date: ["15 Oct", "2026"]

# Reusable blocks. A page uses one with `- type: <type>` + `ref: <name>`,
# and may override individual fields (e.g. `line`, `note`, `actions`).
blocks:

  stages:
    type: stages
    id: how
    statement: "{shared:method}"
    heading: "{shared:stages.heading}"
    items:
      - key: assess
        name: "{shared:stages.names.assess}"
        line: "{shared:stages.lines.assess}"
        image_alt: "{shared:stages.image_alts.assess}"
      - key: harden
        name: "{shared:stages.names.harden}"
        line: "{shared:stages.lines.harden}"
        image_alt: "{shared:stages.image_alts.harden}"
      - key: verify
        name: "{shared:stages.names.verify}"
        line: "{shared:stages.lines.verify}"
        image_alt: "{shared:stages.image_alts.verify}"
    record_date: "{shared:stages.record_date}"
    price_strip:
      ref: price_strip
    link:
      label: "{shared:labels.how_it_works}"
      href: /en/how-it-works/

  price_strip:
    type: price-strip
    stage_names: false
    bands:
      - caption: Assess
        stages: [assess]
        items:
          - label: "{shared:labels.first_step}"
            price_key: assessment
      - caption: Harden + Verify
        stages: [harden, verify]
        items:
          - label: "{shared:offers.shield.short}"
            price_key: personalShield
          - label: "{shared:offers.two.short}"
            price_key: shieldForTwo
          - label: "{shared:offers.inner.name}"
            price_key: innerCircle

  price_summary:
    type: price-summary
    items:
      - tag: "{shared:labels.start_here}"
        name: "{shared:labels.first_step}"
        price_key: assessment
        note: "{shared:offers.assessment.credit_short}"
      - name: "{shared:offers.shield.name}"
        price_key: personalShield
        note: "{shared:offers.shield.home_line}"
    link:
      label: "{shared:labels.all_tiers}"
      href: /en/pricing/
      kind: more

  method:
    type: method-statement
    statement: "{shared:method}"

  specimen:
    type: specimen
    heading: What you take home after the first visit.
    document:
      stamp: Confidential
      title: Exposure summary
      subtitle: "{shared:offers.assessment.name}"
      date: "{shared:stages.record_date}"
      entries:
        - label: Your circumstances
          redacted: true
        - label: Reviewed
          text: Devices, accounts, recovery routes
        - label: Found and changed
          items:
            - Recovery email updated
            - Old tablet signed out
        - label: Remaining
          text: Shared family album, kept by choice
        - label: Ordered next steps
          ordered: true
          items:
            - Move recovery to your own number
            - Review location sharing
            - Set up security keys
    caption: Illustrative example. Your summary reflects your own circumstances.

  offer_first_step:
    type: offer
    tag: "{shared:labels.start_here}"
    name: "{shared:offers.assessment.name}"
    price_key: assessment
    credit: "{shared:offers.assessment.credit}"
    body: "{shared:offers.assessment.body}"
    link:
      label: "{shared:labels.conditions}"
      href: /en/conditions/
      kind: more

  contact:
    type: contact
    heading: Start with a private conversation.
    body: "Your message receives a personal reply. {shared:common.first_conversation}"
    actions: [whatsapp, signal]
