name: Firefox diagnosis

on:
  push:
    branches: [codex/firefox-diagnostics]

permissions:
  contents: read

jobs:
  firefox:
    name: Firefox motion diagnosis
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:42f02d323c310069b4d54c94bd91a608966a486c3492c48ae0b1cea747ec5ca2
      options: --user pwuser
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Run Firefox motion diagnosis
        timeout-minutes: 3
        env:
          HOME_MOTION_BROWSERS: firefox
          HOME_MOTION_ARTIFACT_DIR: ${{ runner.temp }}/firefox-diagnostics
        run: |
          mkdir -p "$HOME_MOTION_ARTIFACT_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$HOME_MOTION_ARTIFACT_DIR/source-sha.txt"
          npm run check:home-motion
      - name: Retain Firefox diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toza-firefox-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firefox-diagnostics
          if-no-files-found: warn
          retention-days: 7
