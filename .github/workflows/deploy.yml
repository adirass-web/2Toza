name: Deploy Toza to Cloudflare Pages

on:
  push:
    branches:
      - main

concurrency:
  group: toza-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_ACCOUNT_ID: cfd055f2f8175d13377bd64e9620ea36
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PROJECT_NAME: toza-site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build-tool audit policy and upstream residuals
        run: npm run test:audit-policy && npm run audit:tools

      - name: Verify route, copy, RTL, links, and CI contracts
        run: npm run verify:all

      - name: Verify local Pages routing
        run: npm run verify:pages

      - name: Install Chromium for RTL visual checks
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium chromium-headless-shell

      - name: Run RTL visual checks
        run: npm run test:rtl-visual

      - name: Ensure new Toza Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}"
          if ! curl -fsS "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" >/dev/null; then
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${CF_PROJECT_NAME}\",\"production_branch\":\"main\"}" >/dev/null
          fi

      - name: Deploy to new Toza Pages project
        run: npm run pages:deploy -- _site --project-name "$CF_PROJECT_NAME" --branch main --commit-hash "$GITHUB_SHA"

      - name: Verify the published release
        env:
          CLOUDFLARE_API_TOKEN: ''
          RELEASE_HEAD_SHA: ${{ github.sha }}
          TOZA_CHECK_MODE: production
        run: node scripts/verify-hosted-release.mjs

      - name: Preserve production verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-checks
          path: |
            .wrangler/hosted-release-checks.json
            .wrangler/hosted-mismatch.json
          include-hidden-files: true
          if-no-files-found: ignore
