name: Deploy preview (design/radical)

# Concept boards only. Deploys site/ to the Cloudflare Pages project "toza-v2" as the
# branch preview design-radical.toza-v2.pages.dev (noindex). Never touches main or production.
on:
  push:
    branches: ['design/radical']

permissions:
  contents: read

concurrency:
  group: preview-design-radical
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Copy parity (spec §3)
        run: npm run check
      - name: Noindex present on every page
        run: |
          for f in $(find site -name '*.html'); do
            grep -q 'name="robots" content="noindex' "$f" || { echo "::error::$f lacks noindex"; exit 1; }
          done
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4.150.0 pages deploy site --project-name toza-v2 --branch design/radical --commit-hash "$GITHUB_SHA"
