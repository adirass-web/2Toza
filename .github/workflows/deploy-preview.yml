name: Deploy preview (retired)

# Preview deployment moved into the Verify workflow's dependent deploy_preview
# job. That job downloads the artifact from the successful Verify run and
# records its repository, ref, SHA, run attempt, and artifact hash. This file is
# retained to avoid deleting a handoff-tracked workflow; it has no deploy path.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the retired workflow
        run: echo "Preview deployment is handled by the Verify workflow's validated-artifact job."
