    </g>
    <g id="category-shared-access" class="category" data-category="shared-access">
      <g class="icon" transform="translate(1060 730) scale(0.77)">
        <circle cx="-21" r="8"/>
        <circle cx="21" cy="-22" r="8"/>
        <circle cx="21" cy="22" r="8"/>
        <path d="m-14-4 28-14M-14 4l28 14"/>
      </g>
      <text class="category-label" x="1060" y="776" text-anchor="middle">Shared access</text>
    </g>
  </g>
  <g id="connections">
    <path id="connection-who-relationships" class="route" data-question="who" data-source="relationships" d="M472 425Q297.5 110 145 180"/>
    <path id="connection-who-photos" class="route" data-question="who" data-source="photos" d="M687 410Q405.0 110 145 180"/>
    <path id="connection-who-identity" class="route" data-question="who" data-source="identity" d="M932 565Q527.5 110 145 180"/>
    <path id="connection-who-shared-access" class="route" data-question="who" data-source="shared-access" d="M1082 730Q602.5 110 145 180"/>
    <path id="connection-what-messages" class="route" data-question="what" data-source="messages" d="M377 330Q522.5 30 690 100"/>
    <path id="connection-what-documents" class="route" data-question="what" data-source="documents" d="M727 535Q697.5 30 690 100"/>
    <path id="connection-what-payments" class="route" data-question="what" data-source="payments" d="M662 285Q665.0 30 690 100"/>
    <path id="connection-what-health" class="route" data-question="what" data-source="health" d="M552 520Q610.0 30 690 100"/>
    <path id="connection-where-location" class="route" data-question="where" data-source="location" d="M902 320Q1065.0 165 1250 235"/>
    <path id="connection-where-photos" class="route" data-question="where" data-source="photos" d="M687 410Q957.5 165 1250 235"/>
    <path id="connection-where-bluetooth" class="route" data-question="where" data-source="bluetooth" d="M1112 615Q1170.0 165 1250 235"/>
    <path id="connection-when-calendar" class="route" data-question="when" data-source="calendar" d="M907 445Q1067.5 345 1250 415"/>
    <path id="connection-when-messages" class="route" data-question="when" data-source="messages" d="M377 330Q802.5 270 1250 415"/>
    <path id="connection-why-browsing" class="route" data-question="why" data-source="browsing" d="M1152 495Q1230.0 435 1330 820"/>
