        <path d="M0 30C-10 15-23 1-23-12a23 23 0 0 1 46 0C23 1 10 15 0 30Z"/>
        <circle cy="-12" r="8"/>
      </g>
      <text class="category-label" x="590" y="551" text-anchor="middle">Location</text>
    </g>
    <g id="category-calendar" class="category" data-category="calendar">
      <g class="icon" transform="translate(785 540) scale(0.7)">
        <rect x="-27" y="-21" width="54" height="46" rx="4"/>
        <path d="M-16-29v16M16-29v16M-27-6h54"/>
        <circle cx="-14" cy="5" r="2"/>
        <circle cy="5" r="2"/>
        <circle cx="14" cy="5" r="2"/>
        <circle cx="-14" cy="17" r="2"/>
        <circle cy="17" r="2"/>
        <circle cx="14" cy="17" r="2"/>
      </g>
      <text class="category-label" x="785" y="586" text-anchor="middle">Calendar</text>
    </g>
    <g id="category-identity" class="category" data-category="identity">
      <g class="icon" transform="translate(980 490) scale(0.7)">
        <rect x="-31" y="-22" width="62" height="44" rx="5"/>
        <circle cx="-13" cy="-6" r="7"/>
        <path d="M-25 15c0-16 24-16 24 0M5-9h17M5 0h17M5 9h11"/>
      </g>
      <text class="category-label" x="980" y="536" text-anchor="middle">Identity</text>
    </g>
    <g id="category-browsing" class="category" data-category="browsing">
      <g class="icon" transform="translate(590 695) scale(0.7)">
        <circle r="27"/>
        <ellipse rx="12" ry="27"/>
        <path d="M-27 0h54M-23-13h46M-23 13h46M0-27v54"/>
      </g>
      <text class="category-label" x="590" y="741" text-anchor="middle">Browsing</text>
    </g>
    <g id="category-bluetooth" class="category" data-category="bluetooth">
      <g class="icon" transform="translate(785 730) scale(0.7)">
        <path d="M-15-17 15 13 0 28v-56l15 15-30 30"/>
      </g>
      <text class="category-label" x="785" y="776" text-anchor="middle">Bluetooth</text>
    </g>
    <g id="category-shared-access" class="category" data-category="shared-access">
      <g class="icon" transform="translate(980 680) scale(0.7)">
        <circle cx="-21" r="8"/>
        <circle cx="21" cy="-22" r="8"/>
        <circle cx="21" cy="22" r="8"/>
        <path d="m-14-4 28-14M-14 4l28 14"/>
      </g>
      <text class="category-label" x="980" y="726" text-anchor="middle">Shared access</text>
    </g>
  </g>
  <g id="questions">
    <g id="question-who" class="question" data-question="who">
      <text class="question-label" x="1230" y="125" text-anchor="start">Who</text>
    </g>
    <g id="question-what" class="question" data-question="what">
      <text class="question-label" x="1230" y="275" text-anchor="start">What</text>
    </g>
    <g id="question-where" class="question" data-question="where">
      <text class="question-label" x="1230" y="445" text-anchor="start">Where</text>
    </g>
    <g id="question-when" class="question" data-question="when">
      <text class="question-label" x="1230" y="615" text-anchor="start">When</text>
    </g>
    <g id="question-why" class="question" data-question="why">
      <text class="question-label" x="1230" y="795" text-anchor="start">Why?</text>
    </g>
  </g>
</svg>
