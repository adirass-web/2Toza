<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="v3-title v3-desc">
  <title id="v3-title">03 Woven traces</title>
  <desc id="v3-desc">A face-up phone at the left feeds a broad weave of traces into five questions on the right. Twelve digital categories connect to who, what, where, when and why. Connections are illustrative; why indicates inferred intentions.</desc>
  <style>:root{--ink:#263631;--muted:#737e74;--line:#b1b7ab;--paper:#f5f1e8}svg{background:var(--paper)}path,line,rect,circle,ellipse,polyline,polygon{vector-effect:non-scaling-stroke}text{fill:var(--ink);font-family:Arial,Helvetica,sans-serif}.icon{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.category-label{font-size:17px}.question-label{font:42px Georgia,'Times New Roman',serif}.plane{fill:none;stroke:var(--line);stroke-width:1}.phone{fill:var(--paper);stroke:var(--ink);stroke-width:1.7;stroke-linejoin:round}.detail{fill:none;stroke:var(--muted);stroke-width:.9}.route{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 5;stroke-linecap:round;opacity:.6}.route[data-question=why]{stroke-dasharray:5 6}.dot{fill:var(--ink)}.leader{fill:none;stroke:var(--line);stroke-width:.8}.is-dim{opacity:.12}.is-active{opacity:1;stroke:var(--ink);stroke-width:1.8}.is-selected .icon{stroke-width:2.4}.category,.question,.route{transition:opacity .25s ease}@media(prefers-reduced-motion:reduce){.category,.question,.route{transition:none}}</style>
  <g id="phone" transform="translate(105 385) rotate(-14) scale(0.72)">
    <path class="phone" d="M0 20Q0 5 22 0L420 88Q444 92 432 108L322 181Q313 187 293 183L-100 96Q-119 92-108 78Z"/>
    <path class="phone" d="M-111 83v15q0 9 14 12l389 87q20 5 31-2l109-73v-17M-100 96l393 87q20 5 29-2l109-73"/>
    <path class="detail" d="M15 19 416 108 310 176-96 86Z"/>
    <path class="detail" d="m-65 110 30 7v6l-30-7m48 4 42 9v6l-42-9M295 185v14"/>
  </g>
  <g id="connections">
    <path id="connection-who-relationships" class="route" data-question="who" data-source="relationships" d="M310 460C410 160 475 130 759 160S1100 110 1212 110"/>
    <path id="connection-who-photos" class="route" data-question="who" data-source="photos" d="M310 460C410 350 475 320 759 350S1100 110 1212 110"/>
    <path id="connection-who-identity" class="route" data-question="who" data-source="identity" d="M310 460C410 490 475 460 954 490S1100 110 1212 110"/>
    <path id="connection-who-shared-access" class="route" data-question="who" data-source="shared-access" d="M310 460C410 680 475 650 954 680S1100 110 1212 110"/>
    <path id="connection-what-messages" class="route" data-question="what" data-source="messages" d="M310 460C410 125 475 95 564 125S1100 260 1212 260"/>
    <path id="connection-what-documents" class="route" data-question="what" data-source="documents" d="M310 460C410 300 475 270 954 300S1100 260 1212 260"/>
    <path id="connection-what-payments" class="route" data-question="what" data-source="payments" d="M310 460C410 315 475 285 564 315S1100 260 1212 260"/>
    <path id="connection-what-health" class="route" data-question="what" data-source="health" d="M310 460C410 110 475 80 954 110S1100 260 1212 260"/>
    <path id="connection-where-location" class="route" data-question="where" data-source="location" d="M310 460C410 505 475 475 564 505S1100 430 1212 430"/>
    <path id="connection-where-photos" class="route" data-question="where" data-source="photos" d="M310 460C410 350 475 320 759 350S1100 430 1212 430"/>
    <path id="connection-where-bluetooth" class="route" data-question="where" data-source="bluetooth" d="M310 460C410 730 475 700 759 730S1100 430 1212 430"/>
    <path id="connection-when-calendar" class="route" data-question="when" data-source="calendar" d="M310 460C410 540 475 510 759 540S1100 600 1212 600"/>
    <path id="connection-when-messages" class="route" data-question="when" data-source="messages" d="M310 460C410 125 475 95 564 125S1100 600 1212 600"/>
    <path id="connection-why-browsing" class="route" data-question="why" data-source="browsing" d="M310 460C410 695 475 665 564 695S1100 780 1212 780"/>
    <path id="connection-why-calendar" class="route" data-question="why" data-source="calendar" d="M310 460C410 540 475 510 759 540S1100 780 1212 780"/>
    <path id="connection-why-payments" class="route" data-question="why" data-source="payments" d="M310 460C410 315 475 285 564 315S1100 780 1212 780"/>
  </g>
  <g id="trace-weave" class="motion-layer" data-collapse-x="-100" data-collapse-y="0">
