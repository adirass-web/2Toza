        <path d="M0 25C-44-3-25-38-2-15L0-12l2-3C25-38 44-3 0 25Z"/>
      </g>
      <text class="category-label" x="785" y="206" text-anchor="middle">Relationships</text>
    </g>
    <g id="category-health" class="category" data-category="health">
      <g class="icon" transform="translate(980 110) scale(0.7)">
        <path d="M-31 0h17l7-19L3 23l9-31 6 8h15"/>
      </g>
      <text class="category-label" x="980" y="156" text-anchor="middle">Health</text>
    </g>
    <g id="category-payments" class="category" data-category="payments">
      <g class="icon" transform="translate(590 315) scale(0.7)">
        <rect x="-28" y="-18" width="56" height="36" rx="5"/>
        <path d="M-28-7h56M-18 8h14"/>
      </g>
      <text class="category-label" x="590" y="361" text-anchor="middle">Payments</text>
    </g>
    <g id="category-photos" class="category" data-category="photos">
      <g class="icon" transform="translate(785 350) scale(0.7)">
        <rect x="-26" y="-22" width="52" height="44" rx="4"/>
        <circle cx="12" cy="-10" r="4"/>
        <path d="m-25 16 16-18 13 14 7-8 15 16"/>
      </g>
      <text class="category-label" x="785" y="396" text-anchor="middle">Photos</text>
    </g>
