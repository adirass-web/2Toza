      <text class="question-label" x="1270" y="100" text-anchor="end">What</text>
    </g>
    <g id="question-where" class="question" data-question="where">
      <text class="question-label" x="65" y="560" text-anchor="start">Where</text>
    </g>
    <g id="question-when" class="question" data-question="when">
      <text class="question-label" x="1230" y="510" text-anchor="end">When</text>
