<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="v2-title v2-desc">
  <title id="v2-title">02 Constellation</title>
  <desc id="v2-desc">An oblique upright phone sits in a dispersed constellation of personal traces. No stacked planes. Twelve digital categories connect to who, what, where, when and why. Connections are illustrative; why indicates inferred intentions.</desc>
  <style>:root{--ink:#263631;--muted:#737e74;--line:#b1b7ab;--paper:#f5f1e8}svg{background:var(--paper)}path,line,rect,circle,ellipse,polyline,polygon{vector-effect:non-scaling-stroke}text{fill:var(--ink);font-family:Arial,Helvetica,sans-serif}.icon{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.category-label{font-size:17px}.question-label{font:42px Georgia,'Times New Roman',serif}.plane{fill:none;stroke:var(--line);stroke-width:1}.phone{fill:var(--paper);stroke:var(--ink);stroke-width:1.7;stroke-linejoin:round}.detail{fill:none;stroke:var(--muted);stroke-width:.9}.route{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 5;stroke-linecap:round;opacity:.6}.route[data-question=why]{stroke-dasharray:5 6}.dot{fill:var(--ink)}.leader{fill:none;stroke:var(--line);stroke-width:.8}.is-dim{opacity:.12}.is-active{opacity:1;stroke:var(--ink);stroke-width:1.8}.is-selected .icon{stroke-width:2.4}.category,.question,.route{transition:opacity .25s ease}@media(prefers-reduced-motion:reduce){.category,.question,.route{transition:none}}</style>
  <g id="phone" transform="translate(700 450) scale(0.87) rotate(-9)">
    <rect class="phone" x="-115" y="-215" width="230" height="430" rx="30"/>
    <rect class="detail" x="-106" y="-206" width="212" height="412" rx="24"/>
    <path class="detail" d="M-34-192h68M-22 193h44M118-117v42M118-55v28"/>
  </g>
  <g id="connections">
    <path id="connection-who-relationships" class="route" data-question="who" data-source="relationships" d="M660 110Q700 450 80 98"/>
    <path id="connection-who-photos" class="route" data-question="who" data-source="photos" d="M1070 395Q700 450 80 98"/>
    <path id="connection-who-identity" class="route" data-question="who" data-source="identity" d="M1030 770Q700 450 80 98"/>
    <path id="connection-who-shared-access" class="route" data-question="who" data-source="shared-access" d="M1110 105Q700 450 80 98"/>
    <path id="connection-what-messages" class="route" data-question="what" data-source="messages" d="M350 225Q700 450 1270 88"/>
    <path id="connection-what-documents" class="route" data-question="what" data-source="documents" d="M1120 600Q700 450 1270 88"/>
    <path id="connection-what-payments" class="route" data-question="what" data-source="payments" d="M260 440Q700 450 1270 88"/>
    <path id="connection-what-health" class="route" data-question="what" data-source="health" d="M1020 190Q700 450 1270 88"/>
    <path id="connection-where-location" class="route" data-question="where" data-source="location" d="M340 650Q700 450 65 548"/>
    <path id="connection-where-photos" class="route" data-question="where" data-source="photos" d="M1070 395Q700 450 65 548"/>
    <path id="connection-where-bluetooth" class="route" data-question="where" data-source="bluetooth" d="M230 800Q700 450 65 548"/>
    <path id="connection-when-calendar" class="route" data-question="when" data-source="calendar" d="M790 760Q700 450 1230 498"/>
    <path id="connection-when-messages" class="route" data-question="when" data-source="messages" d="M350 225Q700 450 1230 498"/>
    <path id="connection-why-browsing" class="route" data-question="why" data-source="browsing" d="M500 800Q700 450 1270 843"/>
    <path id="connection-why-calendar" class="route" data-question="why" data-source="calendar" d="M790 760Q700 450 1270 843"/>
    <path id="connection-why-payments" class="route" data-question="why" data-source="payments" d="M260 440Q700 450 1270 843"/>
  </g>
  <g id="trace-field" class="motion-layer" data-collapse-x="0" data-collapse-y="40">
    <path class="leader" d="M700 450  350 225"/>
    <g id="category-messages" class="category" data-category="messages">
      <g class="icon" transform="translate(350 225) scale(0.8)">
        <path d="M-25-19h50v32H-9l-13 12V13h-3zM-15-8h30M-15 0h30M-15 8H3"/>
      </g>
