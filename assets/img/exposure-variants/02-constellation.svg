        <circle cx="-14" cy="5" r="2"/>
        <circle cy="5" r="2"/>
        <circle cx="14" cy="5" r="2"/>
        <circle cx="-14" cy="17" r="2"/>
        <circle cy="17" r="2"/>
        <circle cx="14" cy="17" r="2"/>
      </g>
      <text class="category-label" x="790" y="806" text-anchor="middle">Calendar</text>
    </g>
    <path class="leader" d="M700 450  1030 770"/>
    <g id="category-identity" class="category" data-category="identity">
      <g class="icon" transform="translate(1030 770) scale(0.8)">
        <rect x="-31" y="-22" width="62" height="44" rx="5"/>
        <circle cx="-13" cy="-6" r="7"/>
        <path d="M-25 15c0-16 24-16 24 0M5-9h17M5 0h17M5 9h11"/>
      </g>
      <text class="category-label" x="1030" y="816" text-anchor="middle">Identity</text>
    </g>
    <path class="leader" d="M700 450  500 800"/>
    <g id="category-browsing" class="category" data-category="browsing">
      <g class="icon" transform="translate(500 800) scale(0.8)">
        <circle r="27"/>
        <ellipse rx="12" ry="27"/>
        <path d="M-27 0h54M-23-13h46M-23 13h46M0-27v54"/>
      </g>
      <text class="category-label" x="500" y="846" text-anchor="middle">Browsing</text>
    </g>
    <path class="leader" d="M700 450  230 800"/>
    <g id="category-bluetooth" class="category" data-category="bluetooth">
      <g class="icon" transform="translate(230 800) scale(0.8)">
        <path d="M-15-17 15 13 0 28v-56l15 15-30 30"/>
      </g>
      <text class="category-label" x="230" y="846" text-anchor="middle">Bluetooth</text>
    </g>
    <path class="leader" d="M700 450  1110 105"/>
    <g id="category-shared-access" class="category" data-category="shared-access">
      <g class="icon" transform="translate(1110 105) scale(0.8)">
        <circle cx="-21" r="8"/>
        <circle cx="21" cy="-22" r="8"/>
        <circle cx="21" cy="22" r="8"/>
        <path d="m-14-4 28-14M-14 4l28 14"/>
