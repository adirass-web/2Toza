    <g id="category-payments" class="category" data-category="payments">
      <g class="icon" transform="translate(260 440) scale(0.8)">
        <rect x="-28" y="-18" width="56" height="36" rx="5"/>
        <path d="M-28-7h56M-18 8h14"/>
      </g>
      <text class="category-label" x="260" y="486" text-anchor="middle">Payments</text>
    </g>
    <path class="leader" d="M700 450  1070 395"/>
    <g id="category-photos" class="category" data-category="photos">
      <g class="icon" transform="translate(1070 395) scale(0.8)">
