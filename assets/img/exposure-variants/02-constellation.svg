        <circle cx="12" cy="-10" r="4"/>
        <path d="m-25 16 16-18 13 14 7-8 15 16"/>
      </g>
      <text class="category-label" x="1070" y="441" text-anchor="middle">Photos</text>
    </g>
    <path class="leader" d="M700 450  1120 600"/>
    <g id="category-documents" class="category" data-category="documents">
