<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160" role="img" aria-labelledby="exposure-title exposure-desc">
<title id="exposure-title">How digital traces connect</title>
<desc id="exposure-desc">A face-up phone with four transparent information layers above it. Twelve categories connect across layers to five questions: who, what, where, when and why. Dashed paths to why represent possible inferences about intentions, not established facts.</desc>
<style>
:root{--ink:#263631;--muted:#68726b;--line:#a5aaa0;--paper:#f5f1e8}svg{background:var(--paper);color:var(--ink)}path,rect,circle,ellipse,line,polyline{vector-effect:non-scaling-stroke}text{fill:var(--ink);font-family:Arial,Helvetica,sans-serif}.plane{fill:none;stroke:var(--line);stroke-width:1}.icon{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.category-label{font-size:19px}.leader{fill:none;stroke:var(--muted);stroke-width:1}.anchor{fill:var(--ink);stroke:none}.question-label{font-family:Georgia,'Times New Roman',serif;font-size:48px}.route{fill:none;stroke:var(--muted);stroke-width:1.1;stroke-dasharray:2 6;stroke-linecap:round;opacity:.65}.route[data-question="when"]{stroke-dasharray:none;stroke-width:1.4}.route[data-question="why"]{stroke-dasharray:4 7}.phone-line{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}.phone-detail{fill:none;stroke:var(--line);stroke-width:1}.is-dim{opacity:.16}.is-active{opacity:1;stroke:var(--ink);stroke-width:1.9}.category,.question,.route{transition:opacity .25s ease}.category.is-selected .icon{stroke-width:2.5}
@media(prefers-reduced-motion:reduce){.category,.question,.route{transition:none}}
</style>
