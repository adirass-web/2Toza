      </g></g><g id="context-relationships" class="faint" transform="translate(505 700)"><g class="icon" transform="scale(.48)"><path xmlns="http://www.w3.org/2000/svg" d="M0 25C-44-3-25-38-2-15L0-12l2-3C25-38 44-3 0 25Z" />
      </g></g><g id="context-identity" class="faint" transform="translate(250 415)"><g class="icon" transform="scale(.48)"><rect xmlns="http://www.w3.org/2000/svg" x="-31" y="-22" width="62" height="44" rx="5" />
