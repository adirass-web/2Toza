<svg xmlns="http://www.w3.org/2000/svg" class="toza-orbital" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="orbital-title orbital-desc"><title id="orbital-title">Separate traces can reveal places</title><desc id="orbital-desc">An angled phone within fine orbital tracks. Location, photos and Bluetooth traces converge to suggest where someone may have been. A Bluetooth pairing alone does not establish a visit. The canvas is transparent.</desc><style>
.toza-orbital{--o-ink:#11302a;--o-mint:#9de0cb;--o-brass:#7d5f24;--o-muted:#6e8980;--o-line:#aac1b8;color:var(--o-ink)}
.toza-orbital path,.toza-orbital ellipse,.toza-orbital circle,.toza-orbital rect{vector-effect:non-scaling-stroke}
.toza-orbital text{font-family:Arial,Helvetica,sans-serif;fill:var(--o-ink)}
.toza-orbital .orbit{fill:none;stroke:var(--o-line);stroke-width:.8;opacity:.6}
.toza-orbital .orbit-detail{fill:none;stroke:var(--o-mint);stroke-width:1.4;stroke-dasharray:1 9;stroke-linecap:round}
.toza-orbital .icon{fill:none;stroke:var(--o-ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.toza-orbital .device-face{fill:var(--o-mint);fill-opacity:.055;stroke:var(--o-ink);stroke-width:1.55;stroke-linejoin:round}
.toza-orbital .detail{fill:none;stroke:var(--o-muted);stroke-width:.75}
.toza-orbital .faint{opacity:.22}.toza-orbital .trace-name{font-size:19px;font-weight:400}.toza-orbital .micro{font:10px Arial,Helvetica,sans-serif;letter-spacing:1.6px;fill:var(--o-muted)}
.toza-orbital .node-ring{fill:var(--o-mint);fill-opacity:.12;stroke:var(--o-line);stroke-width:.8}
.toza-orbital .node-focus{fill:none;stroke:var(--o-mint);stroke-width:3;opacity:.6}
.toza-orbital .source{opacity:.7}.toza-orbital .source.awake{opacity:1}.toza-orbital .source.awake .node-ring{fill-opacity:.4;stroke:var(--o-mint);stroke-width:1.8}
.toza-orbital .signal{fill:none;stroke:var(--o-mint);stroke-width:2.1;stroke-linecap:round}
.toza-orbital .signal-under{fill:none;stroke:var(--o-ink);stroke-width:3;stroke-opacity:.12}
.toza-orbital .packet{fill:var(--o-ink);stroke:var(--o-mint);stroke-width:3}
.toza-orbital .answer{font:64px Georgia,'Times New Roman',serif;letter-spacing:-1.5px}
.toza-orbital .answer-note{font-size:13px;fill:var(--o-muted)}
.toza-orbital .fusion-line{fill:none;stroke:var(--o-brass);stroke-width:1.3}
.toza-orbital .fusion-dot{fill:var(--o-brass)}
</style><g id="orbit-field"><ellipse class="orbit" cx="650" cy="455" rx="470" ry="245" transform="rotate(-14 650 455)"/><ellipse class="orbit" cx="650" cy="455" rx="385" ry="195" transform="rotate(-14 650 455)"/><ellipse class="orbit" cx="650" cy="455" rx="290" ry="128" transform="rotate(-14 650 455)"/><ellipse class="orbit-detail" cx="650" cy="455" rx="479" ry="251" transform="rotate(-14 650 455)"/><path class="orbit" d="M143 520h14m104-232 8 9m868-5-10 8M900 703l-6-9"/></g><g id="context-messages" class="faint" transform="translate(455 230)"><g class="icon" transform="scale(.48)"><path xmlns="http://www.w3.org/2000/svg" d="M-25-19h50v32H-9l-13 12V13h-3zM-15-8h30M-15 0h30M-15 8H3" />
      </g></g><g id="context-health" class="faint" transform="translate(755 185)"><g class="icon" transform="scale(.48)"><path xmlns="http://www.w3.org/2000/svg" d="M-31 0h17l7-19L3 23l9-31 6 8h15" />
